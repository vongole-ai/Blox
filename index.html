<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abismo Bioluminiscente</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>

    <canvas id="shader-canvas"></canvas>

    <script>
        // El código GLSL separado en una variable para evitar errores de comillas en el HTML
        const fragmentShader = `
            precision highp float;
            uniform vec2 u_resolution;
            uniform float u_time;

            #define T (u_time*0.2)

            float hash(vec2 p){
                p = fract(p*vec2(123.34, 345.45));
                p += dot(p, p+34.345);
                return fract(p.x*p.y);
            }

            float n2(vec2 p){
                vec2 i = floor(p), f = fract(p);
                f = f*f*(3.0-2.0*f);
                return mix(mix(hash(i), hash(i+vec2(1.0,0.0)), f.x),
                           mix(hash(i+vec2(0.0,1.0)), hash(i+vec2(1.0,1.0)), f.y), f.y);
            }

            float fbm(vec2 p){
                float v = 0.0, a = 0.5;
                for(int i=0;i<5;i++){
                    v += a*n2(p);
                    p = mat2(1.6,1.2,-1.2,1.6)*p;
                    a *= 0.5;
                }
                return v;
            }

            float seafloor(vec3 p){
                float h = fbm(p.xz * 0.1) * 4.0;
                return p.y + h - 1.0;
            }

            float sdCylinder(vec3 p, float r, float h){
                return max(length(p.xz)-r, abs(p.y)-h);
            }

            float coral(vec3 p, float seed){
                float h = 3.0 + seed*4.0;
                float w = 0.2 + seed*0.2;
                float twist = sin(p.y*0.5 + seed*10.0)*0.4;
                vec3 tp = vec3(p.x - twist, p.y, p.z);
                float body = sdCylinder(tp, w, h*0.5);
                float branches = length(tp - vec3(0.0, h*0.5, 0.0)) - (0.8 + seed);
                branches = min(branches, length(tp - vec3(0.6, h*0.4, 0.3)) - 0.5);
                branches = min(branches, length(tp - vec3(-0.5, h*0.3, -0.4)) - 0.6);
                return min(body, branches);
            }

            float vegetation(vec3 p){
                float s = 8.0;
                vec2 id = floor(p.xz/s);
                vec2 q = p.xz - (id+0.5)*s;
                q += (vec2(hash(id+1.0), hash(id+2.0))-0.5)*6.0;
                float seed = hash(id);
                return coral(vec3(q.x, p.y, q.y), seed);
            }

            vec2 map(vec3 p){
                float d_floor = seafloor(p);
                float d_veg = vegetation(p);
                return d_floor < d_veg ? vec2(d_floor, 1.0) : vec2(d_veg, 2.0);
            }

            vec3 norm(vec3 p){
                vec2 e = vec2(0.01, 0.0);
                return normalize(vec3(
                    map(p+e.xyy).x - map(p-e.xyy).x,
                    map(p+e.yxy).x - map(p-e.yxy).x,
                    map(p+e.yyx).x - map(p-e.yyx).x
                ));
            }

            vec2 march(vec3 ro, vec3 rd){
                float t = 0.0;
                float m = -1.0;
                for(int i=0;i<80;i++){
                    vec2 h = map(ro + rd*t);
                    if(h.x < 0.002*t + 0.001){ m = h.y; break; }
                    t += h.x * 0.9;
                    if(t > 60.0) break;
                }
                return vec2(t, m);
            }

            vec3 waterColor(vec3 rd){
                float y = rd.y;
                vec3 deep = vec3(0.01, 0.05, 0.2);
                vec3 surface = vec3(0.1, 0.4, 0.6);
                return mix(deep, surface, max(0.0, y));
            }

            vec3 abyssShading(vec3 p, vec3 n, vec3 rd, float matId){
                vec3 col1 = vec3(0.0, 1.0, 0.8);
                vec3 col2 = vec3(0.6, 0.0, 1.0);
                vec3 col3 = vec3(1.0, 0.0, 0.5);
                float noise = n2(p.xz * 0.5);
                vec3 baseCol = mix(col1, mix(col2, col3, noise), n2(vec2(p.y, noise)));
                float pulse = sin(T * 2.0 + p.y) * 0.5 + 0.5;
                if(matId == 1.0){
                    baseCol = mix(vec3(0.05, 0.1, 0.2), baseCol * 0.2, noise * 0.5);
                }
                float dif = clamp(dot(n, normalize(vec3(0.5, 1.0, 0.5))), 0.0, 1.0);
                return baseCol * (dif + 0.2) * (matId > 1.0 ? pulse * 1.5 : 1.0);
            }

            vec3 aces(vec3 x){
                return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0);
            }

            void main(){
                vec2 res = u_resolution;
                vec2 uv = (gl_FragCoord.xy*2.0 - res)/min(res.x, res.y);
                vec3 ro = vec3(sin(T*0.5)*2.0, 2.0 + sin(T*0.3)*0.5, T*4.0);
                vec3 target = vec3(sin(T*0.5)*2.0, 1.0, T*4.0 + 5.0);
                vec3 ww = normalize(target - ro);
                vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));
                vec3 vv = cross(uu, ww);
                vec3 rd = normalize(uv.x*uu + uv.y*vv + 2.0*ww);
                vec2 hit = march(ro, rd);
                vec3 col;
                if(hit.y < 0.0){
                    col = waterColor(rd);
                } else {
                    vec3 p = ro + rd*hit.x;
                    vec3 n = norm(p);
                    col = abyssShading(p, n, rd, hit.y);
                    float fog = 1.0 - exp(-hit.x * 0.08);
                    col = mix(col, vec3(0.02, 0.08, 0.2), fog);
                }
                vec2 sc = gl_FragCoord.xy/res;
                float p1 = n2(vec2(sc.x*100.0 + T, sc.y*100.0 + T*1.2));
                float p2 = n2(vec2(sc.x*200.0 - T, sc.y*200.0 + T*0.8));
                col += smoothstep(0.98, 1.0, p1) * vec3(0.6, 0.9, 1.0) * 0.3;
                col += smoothstep(0.99, 1.0, p2) * vec3(0.8, 0.4, 1.0) * 0.2;
                col = aces(col * 1.2);
                col = pow(max(col, vec3(0.0)), vec3(0.4545));
                col *= 1.0 - 0.4 * dot(uv, uv);
                gl_FragColor = vec4(col, 1.0);
            }
        `;

        // Función para cargar glslCanvas y arrancar el shader
        function loadShader() {
            const script = document.createElement('script');
            script.src = "https://cdn.jsdelivr.net/npm/glslCanvas@0.2.6/dist/GlslCanvas.min.js";
            script.onload = () => {
                const canvas = document.getElementById('shader-canvas');

                // Asegurar que el buffer de dibujo tenga la resolución real de la pantalla
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                // Instanciamos glslCanvas manualmente y le pasamos el shader
                const sandbox = new GlslCanvas(canvas);
                sandbox.load(fragmentShader);

                // Reajustar resolución al cambiar el tamaño de la ventana
                window.addEventListener('resize', () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                });
            };
            document.body.appendChild(script);
        }

        window.onload = loadShader;
    </script>
</body>
</html>
