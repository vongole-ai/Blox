<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bloxbcn</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #14131a;
      overflow: hidden;
    }
    #stage {
      position: fixed;
      inset: 0;
      cursor: none;
    }
    #c {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="c"></canvas>
  </div>

  <script>
    (function(){
      const stage = document.getElementById('stage');
      const cvs = document.getElementById('c');
      const ctx = cvs.getContext('2d');

      const BG = '#14131a';
      // paleta pastel: honguitos
      const PALETTE = ['#f3c9d8','#dcc8f2','#c3ddf3','#c7eedb','#f8e0b8','#f5d3cb','#e2dbf8','#d0ebe6'];
      // paleta pastel: peces
      const FISH_PALETTE = ['#f7a8c4','#b9a3e8','#8fd0e8','#9fdcb8','#f6c27f','#f39f9f','#a8c8f0'];
      const MAX = 140;
      const FISH_MAX = 24;
      const G = 0.035;

      let W = 0, H = 0, DPR = 1;
      let mush = [];
      let fish = [];
      // caballito de mar (puntero)
      let tx = 0, ty = 0;          // destino: posición del ratón
      let sx = 0, sy = 0;          // posición actual del caballito
      let sVis = 0, sTarget = 0;   // opacidad actual y objetivo
      let sDir = 1;                // hacia dónde mira
      let last = performance.now(), time = 0, nextSpawn = 0, nextFish = 0;

      function resize(){
        const r = stage.getBoundingClientRect();
        W = r.width; H = r.height;
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        cvs.width = Math.round(W * DPR);
        cvs.height = Math.round(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }

      const rnd = (a, b) => a + Math.random() * (b - a);
      const pick = a => a[(Math.random() * a.length) | 0];

      function hexToRgb(h){
        const n = parseInt(h.slice(1), 16);
        return [n >> 16, (n >> 8) & 255, n & 255];
      }

      function mix(hex, toHex, t){
        const a = hexToRgb(hex), b = hexToRgb(toHex);
        return 'rgb(' + a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',') + ')';
      }

      function makeSpots(r){
        const n = 2 + ((Math.random() * 4) | 0);
        const spots = [];
        for (let i = 0; i < n; i++){
          spots.push({
            x: rnd(-0.5, 0.5) * r,
            y: rnd(-0.6, -0.3) * r,
            rad: rnd(0.07, 0.13) * r
          });
        }
        return spots;
      }

      function spawn(x, y){
        if (mush.length >= MAX) mush.shift();
        const z = Math.random();                              // profundidad: 0 lejos, 1 cerca
        const r = 5 + Math.pow(Math.random(), 1.9) * 40;      // mayoría chicos, algunos grandes
        mush.push({
          kind: 'mush',
          x: x != null ? x : rnd(20, W - 20),
          y: y != null ? y : -r * 2 - 20,
          vx: rnd(-0.15, 0.15),
          vy: rnd(0.05, 0.3),
          r: r,
          z: z,
          alpha: 0.45 + 0.5 * z,
          maxV: 0.6 + 0.9 * z,                                // velocidad máxima de caída
          rot: rnd(-0.35, 0.35),
          vr: rnd(-0.005, 0.005),
          color: pick(PALETTE),
          spots: makeSpots(r),
          seed: Math.random() * 100
        });
      }

      function spawnFish(x){
        if (fish.length >= FISH_MAX) return;
        const dir = Math.random() < 0.5 ? 1 : -1;
        const z = Math.random();
        const s = 6 + Math.pow(Math.random(), 1.6) * 26;      // tamaños variados
        const speed = (0.25 + 0.6 * z) * rnd(0.8, 1.2);
        fish.push({
          kind: 'fish',
          x: x != null ? x : (dir > 0 ? -s * 3 : W + s * 3),
          y: rnd(0.08 * H, 0.92 * H),
          vx: dir * speed,
          s: s,
          z: z,
          alpha: 0.5 + 0.45 * z,
          color: pick(FISH_PALETTE),
          seed: Math.random() * 100
        });
      }

      function physics(){
        for (const m of mush){
          m.vy = Math.min(m.vy + G * (0.6 + m.z * 0.8), m.maxV);
          m.vx *= 0.99;
          m.x += m.vx + Math.sin(time * 0.0006 + m.seed) * 0.08;
          m.y += m.vy;
          m.rot += m.vr;
          m.vr *= 0.995;
        }

        for (const m of mush){
          const bottom = m.r * 1.3;
          if (m.y + bottom > H){
            m.y = H - bottom;
            m.vy = 0;
            m.vx *= 0.8;
            m.vr *= 0.8;
          }
          if (m.x < m.r){ m.x = m.r; m.vx = Math.abs(m.vx) * 0.3; }
          if (m.x > W - m.r){ m.x = W - m.r; m.vx = -Math.abs(m.vx) * 0.3; }
        }

        for (let i = 0; i < mush.length; i++){
          for (let j = i + 1; j < mush.length; j++){
            const a = mush[i], b = mush[j];
            if (Math.abs(a.z - b.z) > 0.25) continue;
            const ax = a.x, ay = a.y - a.r * 0.4;
            const bx = b.x, by = b.y - b.r * 0.4;
            const dx = bx - ax, dy = by - ay;
            const rr = (a.r + b.r) * 0.8;
            const d2 = dx * dx + dy * dy;
            if (d2 < rr * rr && d2 > 0.0001){
              const d = Math.sqrt(d2);
              const nx = dx / d, ny = dy / d;
              const push = (rr - d) * 0.5;
              a.x -= nx * push; a.y -= ny * push;
              b.x += nx * push; b.y += ny * push;
              const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
              if (rel < 0){
                const imp = rel * 0.4;
                a.vx += nx * imp; a.vy += ny * imp;
                b.vx -= nx * imp; b.vy -= ny * imp;
              }
            }
          }
        }

        // peces: nadan en horizontal con un ligero vaivén, sin gravedad
        for (const f of fish){
          f.x += f.vx;
          f.y += Math.sin(time * 0.0009 + f.seed) * 0.12;
          f.y = Math.max(0.05 * H, Math.min(0.95 * H, f.y));
        }
        fish = fish.filter(f =>
          (f.vx > 0 ? f.x < W + f.s * 4 : f.x > -f.s * 4)
        );
      }

      function drawMush(m){
        const r = m.r;
        ctx.save();
        ctx.globalAlpha = m.alpha;
        ctx.translate(m.x, m.y);
        ctx.rotate(m.rot + Math.sin(time * 0.0007 + m.seed) * 0.025);

        // tallo: fino, ligeramente afinado hacia la base
        const sw = r * 0.22, sh = r * 1.2;
        const gStem = ctx.createLinearGradient(-sw, 0, sw, 0);
        gStem.addColorStop(0, '#e9dfd3');
        gStem.addColorStop(0.5, '#fbf7f1');
        gStem.addColorStop(1, '#e9dfd3');
        ctx.fillStyle = gStem;
        ctx.beginPath();
        ctx.moveTo(-sw * 0.55, 0);
        ctx.bezierCurveTo(-sw * 0.5, sh * 0.5, -sw * 0.75, sh * 0.8, -sw * 0.8, sh);
        ctx.quadraticCurveTo(0, sh * 1.08, sw * 0.8, sh);
        ctx.bezierCurveTo(sw * 0.75, sh * 0.8, sw * 0.5, sh * 0.5, sw * 0.55, 0);
        ctx.closePath();
        ctx.fill();

        // sombrero: cúpula suave con borde ondulado
        const gCap = ctx.createRadialGradient(-r * 0.3, -r * 0.6, r * 0.05, 0, -r * 0.3, r * 1.1);
        gCap.addColorStop(0, mix(m.color, '#ffffff', 0.55));
        gCap.addColorStop(0.7, m.color);
        gCap.addColorStop(1, mix(m.color, '#6b5a7a', 0.12));
        ctx.fillStyle = gCap;
        ctx.beginPath();
        ctx.moveTo(-r, 0);
        ctx.bezierCurveTo(-r * 1.05, -r * 1.0, r * 1.05, -r * 1.0, r, 0);
        ctx.bezierCurveTo(r * 0.6, r * 0.16, r * 0.3, r * 0.02, 0, r * 0.12);
        ctx.bezierCurveTo(-r * 0.3, r * 0.02, -r * 0.6, r * 0.16, -r, 0);
        ctx.closePath();
        ctx.fill();

        // láminas: una línea clara bajo el sombrero
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = Math.max(0.6, r * 0.03);
        ctx.beginPath();
        ctx.moveTo(-r * 0.9, r * 0.02);
        ctx.quadraticCurveTo(0, r * 0.2, r * 0.9, r * 0.02);
        ctx.stroke();

        // puntos discretos
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        for (const s of m.spots){
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.rad, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      function drawFish(f){
        const s = f.s;
        const dir = f.vx >= 0 ? 1 : -1;
        ctx.save();
        ctx.globalAlpha = f.alpha;
        ctx.translate(f.x, f.y);
        ctx.scale(dir, 1);                                    // mira hacia donde nada
        ctx.rotate(Math.sin(time * 0.0009 + f.seed) * 0.05);  // inclinación suave

        // cola: se mueve con el nado
        const wob = Math.sin(time * 0.008 + f.seed) * 0.35;
        ctx.save();
        ctx.translate(-s * 0.8, 0);
        ctx.rotate(wob);
        ctx.fillStyle = mix(f.color, '#ffffff', 0.2);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-s * 0.4, -s * 0.5, -s * 0.8, -s * 0.65);
        ctx.quadraticCurveTo(-s * 0.55, 0, -s * 0.8, s * 0.65);
        ctx.quadraticCurveTo(-s * 0.4, s * 0.5, 0, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // aleta dorsal
        ctx.fillStyle = mix(f.color, '#ffffff', 0.15);
        ctx.beginPath();
        ctx.moveTo(-s * 0.2, -s * 0.45);
        ctx.quadraticCurveTo(s * 0.05, -s * 0.9, s * 0.25, -s * 0.45);
        ctx.closePath();
        ctx.fill();

        // cuerpo
        const gBody = ctx.createRadialGradient(s * 0.2, -s * 0.2, s * 0.05, 0, 0, s * 1.1);
        gBody.addColorStop(0, mix(f.color, '#ffffff', 0.5));
        gBody.addColorStop(0.7, f.color);
        gBody.addColorStop(1, mix(f.color, '#6b5a7a', 0.12));
        ctx.fillStyle = gBody;
        ctx.beginPath();
        ctx.ellipse(0, 0, s, s * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();

        // brillo sobre el lomo
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.beginPath();
        ctx.ellipse(-s * 0.1, -s * 0.25, s * 0.45, s * 0.12, -0.1, 0, Math.PI * 2);
        ctx.fill();

        // aleta pectoral
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        ctx.ellipse(s * 0.1, s * 0.18, s * 0.22, s * 0.1, 0.4, 0, Math.PI * 2);
        ctx.fill();

        // ojo
        ctx.fillStyle = '#fbf7f1';
        ctx.beginPath();
        ctx.arc(s * 0.5, -s * 0.1, Math.max(1, s * 0.13), 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#2a2735';
        ctx.beginPath();
        ctx.arc(s * 0.54, -s * 0.1, Math.max(0.6, s * 0.06), 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawSeahorse(x, y, dir, a){
        const c = '#f8e0b8';                       // melocotón pastel
        const edge = mix(c, '#6b5a7a', 0.22);      // contorno suave
        ctx.save();
        ctx.globalAlpha = a;
        ctx.translate(x, y);
        ctx.scale(dir * 0.55, 0.55);               // dibujo base ~40 px
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // cuerpo en S que termina en cola enroscada
        const body = new Path2D();
        body.moveTo(-2, -8);
        body.bezierCurveTo(-10, -2, 8, 4, 0, 14);
        body.quadraticCurveTo(-3, 20, -7, 18);
        body.quadraticCurveTo(-11, 16, -8, 12);

        ctx.strokeStyle = edge;
        ctx.lineWidth = 9;
        ctx.stroke(body);
        ctx.strokeStyle = c;
        ctx.lineWidth = 6;
        ctx.stroke(body);
        ctx.strokeStyle = 'rgba(255,255,255,0.45)';
        ctx.lineWidth = 1.5;
        ctx.save();
        ctx.translate(-1.5, 0);
        ctx.stroke(body);
        ctx.restore();

        // hocico
        ctx.strokeStyle = edge;
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(1, -12);
        ctx.lineTo(-7, -10);
        ctx.stroke();
        ctx.strokeStyle = c;
        ctx.lineWidth = 3.5;
        ctx.stroke();

        // cabeza
        ctx.fillStyle = edge;
        ctx.beginPath();
        ctx.arc(3, -14, 6.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = c;
        ctx.beginPath();
        ctx.arc(3, -14, 5.6, 0, Math.PI * 2);
        ctx.fill();

        // cresta de púas
        ctx.fillStyle = c;
        ctx.strokeStyle = edge;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-1, -17);
        ctx.lineTo(0, -22);
        ctx.lineTo(2, -18);
        ctx.lineTo(4, -21);
        ctx.lineTo(6, -17);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // ojo
        ctx.fillStyle = '#2a2735';
        ctx.beginPath();
        ctx.arc(4.5, -15, 1.3, 0, Math.PI * 2);
        ctx.fill();

        // aletas y escamas: puntos pálidos a lo largo del lomo
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        for (const [px, py] of [[3, -4], [5, 0], [4, 4], [2, 8]]){
          ctx.beginPath();
          ctx.arc(px, py, 1.3, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      function frame(now){
        time += Math.min(now - last, 50);
        last = now;

        if (now >= nextSpawn){
          spawn();
          nextSpawn = now + rnd(1400, 2600);
        }
        if (now >= nextFish){
          spawnFish();
          nextFish = now + rnd(1800, 3600);
        }

        ctx.fillStyle = BG;
        ctx.fillRect(0, 0, W, H);

        physics();

        // honguitos y peces juntos, los lejanos primero
        const items = mush.concat(fish).sort((a, b) => a.z - b.z);
        for (const it of items){
          if (it.kind === 'fish') drawFish(it);
          else drawMush(it);
        }

        // caballito de mar: sigue al ratón con suavidad
        sx += (tx - sx) * 0.12;
        sy += (ty - sy) * 0.12;
        sVis += (sTarget - sVis) * 0.12;
        if (Math.abs(tx - sx) > 0.5) sDir += ((tx > sx ? 1 : -1) - sDir) * 0.08;
        if (sVis > 0.01) drawSeahorse(sx, sy, sDir, sVis);

        requestAnimationFrame(frame);
      }

      stage.addEventListener('pointerdown', e => {
        const r = stage.getBoundingClientRect();
        spawn(e.clientX - r.left, -30);
      });

      stage.addEventListener('pointermove', e => {
        const r = stage.getBoundingClientRect();
        tx = e.clientX - r.left;
        ty = e.clientY - r.top;
        if (sVis < 0.01){ sx = tx; sy = ty; }   // aparece donde está el ratón
        sTarget = 1;
      });
      stage.addEventListener('pointerleave', () => { sTarget = 0; });

      if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
      window.addEventListener('resize', resize);

      resize();
      for (let i = 0; i < 14; i++) spawn(rnd(20, W - 20), rnd(0, H));
      for (let i = 0; i < 6; i++) spawnFish(rnd(0, W));
      const t0 = performance.now();
      nextSpawn = t0 + 1000;
      nextFish = t0 + 1500;
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
