<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bloxbcn</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>

    <canvas id="shader-canvas"></canvas>

    <script>
        // ============================================================
        // Rotación cada 5 minutos (sincronizada para todos los visitantes)
        // ============================================================
        const TOTAL_SHADERS = 14;
        const MINUTES_PER_BLOCK = 5;
        const BLOCK_MS = MINUTES_PER_BLOCK * 60 * 1000;

        const blockIndex = Math.floor(Date.now() / BLOCK_MS);
        const shaderNumber = (blockIndex % TOTAL_SHADERS) + 1; // 1..13
        const shaderPath = `shaders/shader${shaderNumber}.glsl`;

        // ============================================================
        // Carga de glslCanvas + fetch del shader seleccionado
        // ============================================================
        function loadShader() {
            const canvas = document.getElementById('shader-canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });

            const glslScript = document.createElement('script');
            glslScript.src = "https://cdn.jsdelivr.net/npm/glslCanvas@0.2.6/dist/GlslCanvas.min.js";
            glslScript.onload = () => {
                fetch(shaderPath)
                    .then(res => {
                        if (!res.ok) throw new Error('No se pudo cargar ' + shaderPath);
                        return res.text();
                    })
                    .then(code => {
                        const sandbox = new GlslCanvas(canvas);
                        sandbox.load(code);
                    })
                    .catch(err => {
                        console.error(err);
                    });
            };
            document.body.appendChild(glslScript);
        }

        window.onload = loadShader;
    </script>
</body>
</html>
